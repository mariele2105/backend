openapi: 3.0.0

info:
  title: Minha API REST
  version: 0.1

servers:
  - url: http://localhost:3000/

tags:
  - name: usuarios

paths:

  /usuarios:
    post:
      tags:
        - usuarios
      summary: Criar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                senha:
                  type: string
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '422':
          description: Dados obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'

    delete:
      tags:
        - usuarios
      summary: Remover usuário
      security:
        - JWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
              properties:
                usuario:
                  type: string
      responses:
        '204':
          description: Usuário removido com sucesso (sem conteúdo)

  /usuarios/login:
    post:
      tags:
        - usuarios
      summary: Login do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - senha
              properties:
                usuario:
                  type: string
                senha:
                  type: string
      responses:
        '200':
          description: Token gerado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'

  /usuarios/renovar:
    post:
      tags:
        - usuarios
      summary: Renovar token do usuário autenticado
      security:
        - JWTAuth: []
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          description: Token inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'

components:

  schemas:

    Usuario:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string

    Mensagem:
      type: object
      properties:
        msg:
          type: string

  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: authorization
